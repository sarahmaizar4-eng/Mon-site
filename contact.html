<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarah.M — Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0b0b0f; --fg:#f0ede6; --accent:#c9a96e; --muted:rgba(240,237,230,0.45); --card:rgba(255,255,255,0.04); }
    body { background: var(--bg); color: var(--fg); font-family: 'Syne', sans-serif; min-height: 100vh; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: center; gap: 8px; padding: 18px 24px; background: rgba(11,11,15,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(201,169,110,0.12); }
    nav a { text-decoration: none; color: var(--muted); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 16px; border-radius: 20px; transition: all 0.25s; }
    nav a:hover, nav a.active { color: var(--accent); background: rgba(201,169,110,0.1); }

    .page { min-height: 100vh; display: flex; align-items: center; padding: 120px 10vw 80px; }
    .page-inner { width: 100%; }

    .contact-title-pill { display: inline-block; font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 700; color: var(--accent); border: 2px solid var(--accent); padding: 12px 48px; border-radius: 100px; margin-bottom: 60px; }
    .contact-title-wrap { text-align: center; opacity: 0; animation: fadeUp 0.7s 0.1s forwards; }

    .contact-diamonds { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-bottom: 64px; }
    .diamond-card { background: var(--card); border: 1px solid rgba(201,169,110,0.15); border-radius: 8px; padding: 32px 28px; text-align: center; min-width: 200px; max-width: 240px; opacity: 0; animation: fadeUp 0.7s var(--d, 0s) forwards; transition: border-color 0.25s, transform 0.25s; }
    .diamond-card:hover { border-color: rgba(201,169,110,0.4); transform: translateY(-4px); }
    .diamond-icon { width: 56px; height: 56px; margin: 0 auto 16px; background: rgba(201,169,110,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .diamond-icon svg { width: 24px; height: 24px; stroke: var(--accent); }
    .diamond-label { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .diamond-val { font-size: 0.9rem; color: var(--fg); line-height: 1.5; }
    a.diamond-val.link { color: var(--accent); text-decoration: none; }
    a.diamond-val.link:hover { text-decoration: underline; }

    .contact-cta { text-align: center; opacity: 0; animation: fadeUp 0.7s 0.4s forwards; }
    .contact-cta p { font-size: 1.05rem; color: var(--muted); margin-bottom: 24px; }
    .cta { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: #0b0b0f; text-decoration: none; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 14px 28px; border-radius: 4px; transition: all 0.25s; }
    .cta:hover { background: #e0be84; transform: translateY(-2px); }
    .cta svg { width: 18px; height: 18px; }

    @keyframes fadeUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: none; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="skills.html">Skills</a>
    <a href="services.html">Services</a>
    <a href="contact.html" class="active">Contact</a>
    <a href="chatbot.html">🤖 Chat</a>
  </nav>

  <section class="page">
    <div class="page-inner">
      <div class="contact-title-wrap">
        <div class="contact-title-pill">Contact</div>
      </div>

      <div class="contact-diamonds">

        <div class="diamond-card" style="--d:0.15s">
          <div class="diamond-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <h4 class="diamond-label">Adresse</h4>
          <p class="diamond-val">Cité Nagad, Djibouti</p>

        <div class="diamond-card" style="--d:0.25s">

              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
          <h4 class="diamond-label">Email</h4>
          <a href="mailto:Sarahmaizar4@gmail.com" class="diamond-val link">Sarahmaizar4@gmail.com</a>
        </div>

        <div class="diamond-card" style="--d:0.35s">
          <div class="diamond-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18 2 2 0 0 1 3.59 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.5a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
          <h4 class="diamond-label">N° de Tel</h4>
          <a href="tel:+25377049181" class="diamond-val link">+253 77 04 91 81</a>
        </div>

      </div>

      <div class="contact-cta">
        <p>Have a project in mind? Let's work together!</p>
        <a href="mailto:Sarahmaizar4@gmail.com" class="cta">
          Contact me
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>
  </section>
</body>
</html>
